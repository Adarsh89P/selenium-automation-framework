# Extent Cucumber adapter configuration
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-reports/ExtentReport.html

# Keep screenshots and other media beside the HTML report.
extent.reporter.spark.base64imagesrc=true

# Add execution context to the report.
systeminfo.OS=Windows
systeminfo.Java=Java ${java.version}
systeminfo.Browser=${browser}
systeminfo.Environment=${env}
