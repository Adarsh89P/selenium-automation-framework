# Shared baseline. Anything here can be overridden by the per-environment file
# (dev.properties / stage.properties), by an environment variable, or by -Dkey=value.
#
# Precedence, highest first:
#   -Dkey=value  >  environment variable  >  <env>.properties  >  this file

# ===== Execution =====
browser=chrome
execution=local
headless=true
window.width=1920
window.height=1080

# ===== Timeouts (seconds) =====
# There is no implicit wait anywhere in the framework; this bounds every explicit wait.
explicit.timeout=20
page.load.timeout=40
polling.interval.millis=250

# ===== Grid =====
grid.url=http://localhost:4444/wd/hub

# ===== Cloud grid =====
# Left blank on purpose. Supply cloud.username / cloud.accesskey as environment variables
# (CLOUD_USERNAME / CLOUD_ACCESSKEY) or GitHub Secrets, never in a committed file.
cloud.url=
cloud.username=
cloud.accesskey=
